name: GIcode Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare GIcode branding resources
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
          fi
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable-nodpi app/src/main/res/drawable
          convert assets/branding/gicode_icon_512.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert assets/branding/gicode_icon_512.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert assets/branding/gicode_icon_512.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert assets/branding/gicode_icon_512.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert assets/branding/gicode_icon_512.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert assets/branding/gicode_icon_512.png -resize 432x432 app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cp assets/branding/gicode_splash_1080x1920.png app/src/main/res/drawable-nodpi/gicode_splash.png
      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $ANDROID_HOME"; exit 1; fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build ARMv7 debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GIcode-v0.0.1-ARMv7
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
